<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <!-- Gradientes para efecto 3D -->
    <linearGradient id="bodyTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="bodySide" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="handleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="wheelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bfdbfe"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="6" stdDeviation="6" flood-color="#1e3a8a" flood-opacity="0.5"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Sombra del carrito -->
  <ellipse cx="105" cy="182" rx="52" ry="8" fill="#1e3a8a" fill-opacity="0.3"/>

  <!-- ===== CUERPO DEL CARRITO (perspectiva 3D) ===== -->
  <!-- Cara frontal -->
  <rect x="48" y="80" width="100" height="72" rx="10" fill="url(#bodyTop)" filter="url(#shadow)"/>
  <!-- Cara lateral derecha (profundidad 3D) -->
  <path d="M148 80 L162 68 L162 140 L148 152 Z" fill="url(#bodySide)"/>
  <!-- Cara superior (tapa) -->
  <path d="M48 80 L62 68 L162 68 L148 80 Z" fill="#93c5fd"/>

  <!-- Brillo interno cara frontal -->
  <rect x="48" y="80" width="100" height="36" rx="10" fill="url(#shineGrad)" rx="10"/>

  <!-- Líneas de la rejilla (cara frontal) -->
  <!-- Horizontales -->
  <line x1="52" y1="102" x2="144" y2="102" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>
  <line x1="52" y1="118" x2="144" y2="118" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>
  <line x1="52" y1="134" x2="144" y2="134" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>
  <!-- Verticales -->
  <line x1="73"  y1="82" x2="73"  y2="150" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
  <line x1="98"  y1="82" x2="98"  y2="150" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
  <line x1="123" y1="82" x2="123" y2="150" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>

  <!-- Líneas de la rejilla (cara lateral derecha) -->
  <line x1="148" y1="102" x2="160" y2="92"  stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <line x1="148" y1="118" x2="160" y2="108" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <line x1="148" y1="134" x2="160" y2="124" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>

  <!-- ===== MANGO / HANDLE ===== -->
  <!-- Tubo derecho -->
  <rect x="130" y="54" width="10" height="30" rx="5" fill="url(#handleGrad)"/>
  <!-- Barra horizontal -->
  <rect x="34"  y="50" width="106" height="10" rx="5" fill="url(#handleGrad)"/>
  <!-- Tubo izquierdo -->
  <rect x="34"  y="54" width="10" height="30" rx="5" fill="#3b82f6"/>
  <!-- Soporte diagonal (3D) -->
  <path d="M140 54 L154 44 L154 56 L140 64 Z" fill="#1d4ed8"/>
  <rect x="140" y="44" width="14" height="10" rx="4" fill="url(#handleGrad)"/>

  <!-- ===== RUEDAS ===== -->
  <!-- Rueda izquierda -->
  <circle cx="72"  cy="162" r="12" fill="url(#wheelGrad)" filter="url(#shadow)"/>
  <circle cx="72"  cy="162" r="6"  fill="#1e3a8a"/>
  <circle cx="72"  cy="162" r="2"  fill="#60a5fa"/>
  <!-- Brillo rueda izquierda -->
  <ellipse cx="69" cy="159" rx="3" ry="2" fill="white" fill-opacity="0.4" transform="rotate(-30 69 159)"/>

  <!-- Rueda derecha -->
  <circle cx="128" cy="162" r="12" fill="url(#wheelGrad)" filter="url(#shadow)"/>
  <circle cx="128" cy="162" r="6"  fill="#1e3a8a"/>
  <circle cx="128" cy="162" r="2"  fill="#60a5fa"/>
  <!-- Brillo rueda derecha -->
  <ellipse cx="125" cy="159" rx="3" ry="2" fill="white" fill-opacity="0.4" transform="rotate(-30 125 159)"/>

  <!-- ===== DETALLES DE PRODUCTO DENTRO ===== -->
  <!-- Cajita pequeña dentro del carrito -->
  <rect x="65" y="88" width="22" height="20" rx="3" fill="white" fill-opacity="0.18"/>
  <rect x="92" y="86" width="18" height="24" rx="3" fill="white" fill-opacity="0.12"/>
  <rect x="114" y="90" width="14" height="18" rx="3" fill="white" fill-opacity="0.16"/>
</svg>
